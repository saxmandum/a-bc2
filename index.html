<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>sax's games</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      margin: 0;
      padding: 20px;
    }

    /* SEARCH BAR */
    .search-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    #searchInput {
      padding: 10px;
      width: 100%;
      max-width: 300px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    /* IMAGE */
    .thumb {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      overflow: hidden;
      background: #e0e0e0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TITLE */
    .title {
      text-align: center;
      margin-top: 8px;
      font-size: 14px;
      color: #202124;
    }

    /* PROXY CARD */
    .proxy {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 120px;
      font-weight: bold;
      font-size: 16px;
      background: #f8f9fa;
    }
  </style>
</head>

<body>

  <!-- Search -->
  <div class="search-container">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for a game..."
      onkeyup="searchGames()"
    >
  </div>

  <div class="grid" id="gameGrid"></div>

  <script>
    let allGames = [];

    // Fetch game data from JSON
    fetch('games.json')
      .then(res => res.json())
      .then(data => {
        allGames = data;
        renderGames(allGames);
      })
      .catch(err => console.error("Error loading games.json:", err));

    function renderGames(games) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';

      games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';

        if (game.isProxy) {
          card.classList.add('proxy');
          card.textContent = game.title;
          card.onclick = () => openProxy(game.url);
        } else {
          card.onclick = () => openGame(game.path);
          card.innerHTML = `
            <div class="thumb">
              <img src="${game.cover}" alt="${game.title}">
            </div>
            <div class="title">${game.title}</div>
          `;
        }

        grid.appendChild(card);
      });
    }

    function openGame(path) {
      window.open(`/play.html?url=${encodeURIComponent(path)}`, "_blank");
    }

    function openProxy(url) {
      const win = window.open("", "_blank");
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Proxy</title>
          <style>
            html, body {
              margin: 0;
              padding: 0;
              height: 100%;
              overflow: hidden;
            }
            iframe {
              width: 100%;
              height: 100%;
              border: none;
            }
          </style>
        </head>
        <body>
          <iframe src="${url}" allowfullscreen></iframe>
        </body>
        </html>
      `);
      win.document.close();
    }

    function searchGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allGames.filter(game => 
        game.title.toLowerCase().includes(query)
      );
      renderGames(filtered);
    }
  </script>

</body>
</html>
